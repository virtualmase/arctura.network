name: Editorial source collection
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates without publishing
        run: python3 scripts/collect-signals.py --output "$RUNNER_TEMP/arctura-signal-queue.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-research-queue
          path: ${{ runner.temp }}/arctura-signal-queue.json
          retention-days: 14
